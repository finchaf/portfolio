# A version is installed a day after its release at the earliest: a hijacked release is usually
# caught and pulled within hours. Nothing is excepted — pick the previous version instead.
minimumReleaseAge: 1440

# Install scripts of dependencies do not run: each of these ships a prebuilt binary for the
# platform as an optional dependency and needs no script to work.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false

# typescript-estree asks for minimatch 10, and only 11.0.1 closes its denial of service through
# brace patterns (GHSA of 06.11.2026). It is lint-time code that reads our own globs; 11 keeps the
# API typescript-estree uses, and the Lint gate proves it.
overrides:
  "minimatch@>=7 <11.0.1": "11.0.4"
