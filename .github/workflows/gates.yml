name: Gates

# The gates of scripts/check.py on every pull request: the same command a developer runs before a
# commit. No secrets here, and no key to the server: deploys start on a laptop (ADR-0005).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static gates
            groups: --group docs --group static
          # The browser gates need the build, and a job does not see another's output.
          - name: Build and browser gates
            groups: --group build --group browser
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the gates
        run: python3 scripts/check.py ${{ matrix.groups }}
